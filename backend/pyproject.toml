[project]
name = "together-events-api"
version = "0.1.0"
description = "API for the Together Events semester project"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "email-validator>=2,<3",
